run:
  input_jsonl: /workspace/data/input/pairs.jsonl
  output_dir: /workspace/data/production
  num_shards: 128
  max_pairs_per_shard: 2500
  checkpoint_every: 10
  minimum_free_gib: 80
  minimum_cache_free_gib: 8
  maximum_output_gib: 78
  expected_hours_per_language: 300
  retry_storage_fraction: 0.10
  # Native Qwen WAV roughly doubles storage. The release corpus keeps only
  # canonical 16 kHz PCM16 unless an explicit archival run enables this.
  save_native: false
  resume: true

prepare:
  sources_dir: /workspace/data/sources
  # Archive extraction and SQLite selection run in the container-local
  # filesystem. Only the final manifest/report are persisted to the host.
  work_dir: /tmp/ja-en-direct-s2st-preparation
  reports_dir: /workspace/data/reports/preparation
  target_train_hours: 300
  jesc_fraction: 0.70
  selection_seed: 20260723
  # Used only to select the pre-synthesis 300-hour manifest.
  # Actual release hours are reported after generation.
  ja_chars_per_second: 5.5
  utterance_padding_seconds: 0.5
  short_max_ja_chars: 24
  medium_max_ja_chars: 64
  short_time_fraction: 0.20
  medium_time_fraction: 0.50
  long_time_fraction: 0.30
  include_dev: true
  include_test: true

sources:
  jesc:
    url: https://nlp.stanford.edu/projects/jesc/data/split.tar.gz
    archive_name: jesc-split-2019-05-12.tar.gz
    sha256: 9cc6f2b31225d84b204a1bc4599e5fbb158d5739ba4aa76eab30fea05ed8ccd5
    version: "2019-05-12"
    license_id: CC-BY-SA-4.0
  kftt:
    url: https://www.phontron.com/kftt/download/kftt-data-1.0.tar.gz
    archive_name: kftt-data-1.0.tar.gz
    sha256: fcfcaa670d6d59aa691b0e909c0d7c393852dd2fb1d6310fda9b3282dc6d1638
    version: "1.0"
    license_id: CC-BY-SA-3.0

smoke:
  input_jsonl: /workspace/data/smoke/input/pairs.jsonl
  output_dir: /workspace/data/smoke/production
  pair_count: 5
  minimum_free_gib: 1
  maximum_output_gib: 1

device:
  require_cuda: true
  minimum_vram_gib: 16
  require_bf16: true
  attention: sdpa

tts:
  model_id: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
  revision: f00cf133b78d3c2c35857faba3b1be9b98c4f971
  device: cuda:0
  dtype: bfloat16
  speaker: Ono_Anna
  instruct: ""
  max_new_tokens: 2048
  do_sample: true
  subtalker_do_sample: true
  remove_invalid_values: false
  renormalize_logits: true
  output_sample_rate: 16000
  max_content_retries: 1

asr:
  model_id: openai/whisper-large-v3-turbo
  revision: 60be3615a4d667e1258e8ad29130467587c489aa
  dtype: float16
  attention: sdpa
  do_sample: false
  num_beams: 1
  condition_on_prev_tokens: false

qc:
  max_ja_cer: 0.10
  max_en_wer: 0.10
  min_duration_seconds: 0.7
  max_duration_seconds: 30.0
