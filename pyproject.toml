[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ja-en-direct-s2st-corpus"
version = "0.1.0"
description = "Production Japanese-to-English synthetic speech-pair corpus pipeline"
requires-python = ">=3.10"

[project.scripts]
s2st-corpus = "s2st_corpus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
